name: build-and-release

# Two repositories, one release: this workflow lives on
# peditxos-passwall/PeDitX-Goo-builder, checks out peditx/PeDitX-Goo, compiles
# both platforms, and only publishes when a tag is passed in.
#
#   gh workflow run build-and-release \
#     --repo peditxos-passwall/PeDitX-Goo-builder -f tag=v0.1.0
#
# An empty tag builds and uploads artifacts without creating a release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Empty = build, no release."
        required: false
        default: ""

permissions:
  contents: read

env:
  SOURCE: peditx/PeDitX-Goo

jobs:
  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          repository: peditx/PeDitX-Goo
          token: ${{ secrets.PEDITX_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev

      - name: Check the tag matches the tree
        if: github.event.inputs.tag != ''
        run: |
          tag="${{ github.event.inputs.tag }}"
          tag="${tag#v}"
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          echo "tag=$tag tauri.conf=$conf package.json=$pkg"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ]; then
            echo "tag says $tag but the tree says $conf / $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: PeDitX-Goo-Linux-packages
          path: |
            linux/release/*.deb
            linux/release/*.rpm
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          repository: peditx/PeDitX-Goo
          token: ${{ secrets.PEDITX_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - run: npm ci
      - run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: PeDitX-Goo-Windows-setup
          path: windows/release/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [linux, windows]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be released
        run: find dist -type f | sort

      - name: Create the release on peditx/PeDitX-Goo
        env:
          GH_TOKEN: ${{ secrets.PEDITX_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          gh release create "$tag" dist/* \
            --repo peditx/PeDitX-Goo \
            --title "PeDitX-Goo $tag" \
            --notes "Built by peditxos-passwall/PeDitX-Goo-builder — .deb/.rpm and the Windows NSIS installer." \
